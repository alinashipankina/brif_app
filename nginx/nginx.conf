server {
#    listen 443 ssl;
listen 80; 
   http2 on;
    server_name xn--90ahbhejzcrsf.xn--p1ai;

   # ssl_certificate /etc/letsencrypt/live/xn--90ahbhejzcrsf.xn--p1ai/fullchain.pem;
   # ssl_certificate_key /etc/letsencrypt/live/xn--90ahbhejzcrsf.xn--p1ai/privkey.pem;

    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # Логирование для отладки
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Отдача статических файлов (CSS, JS, изображения)
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Специально для build директории Vite
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Редирект для Livewire assets
    location /livewire/ {
        rewrite ^/livewire/(.*)$ /vendor/livewire/$1 last;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass web:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
